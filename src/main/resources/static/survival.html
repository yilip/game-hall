<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>馃尨 鑽掗噹姹傜敓 - 鎬吔鐗?/title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #2c5530 0%, #1a3320 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .game-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #feca57, #ff9f43);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .day-counter {
            font-size: 18px;
            color: #fff;
            opacity: 0.9;
        }

        /* 鐘舵€侀潰鏉?*/
        .status-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
        }

        .character-display {
            flex: 0 0 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .character-emoji {
            font-size: 80px;
            margin-bottom: 10px;
        }

        .character-name {
            font-size: 14px;
            opacity: 0.8;
        }

        .status-bars {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .status-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 10px;
        }

        .status-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .status-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        .status-fill.health { background: linear-gradient(90deg, #ff6b6b, #ee5a6f); }
        .status-fill.hunger { background: linear-gradient(90deg, #feca57, #ff9f43); }
        .status-fill.thirst { background: linear-gradient(90deg, #54a0ff, #2e86de); }
        .status-fill.energy { background: linear-gradient(90deg, #5f27cd, #341f97); }
        .status-fill.attack { background: linear-gradient(90deg, #ff4757, #ff3838); }
        .status-fill.temperature { background: linear-gradient(90deg, #3498db, #e74c3c); }

        .status-value {
            font-size: 14px;
            font-weight: bold;
            margin-top: 3px;
            text-align: right;
        }

        /* 澶╂皵鏄剧ず */
        .weather-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .weather-icon {
            font-size: 32px;
        }

        .weather-info {
            font-size: 14px;
        }

        .weather-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .weather-effect {
            font-size: 11px;
            opacity: 0.8;
        }

        /* 鍦烘櫙鍖哄煙 */
        .scene-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            min-height: 200px;
            backdrop-filter: blur(10px);
        }

        .scene-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .scene-description {
            font-size: 15px;
            line-height: 1.8;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .scene-emoji {
            font-size: 60px;
            text-align: center;
            margin: 20px 0;
        }

        /* 璧勬簮鍒楄〃 */
        .resources-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .resources-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        .resource-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .resource-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .resource-name {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 3px;
        }

        .resource-count {
            font-size: 16px;
            font-weight: bold;
            color: #feca57;
        }

        /* 鎿嶄綔鎸夐挳 */
        .actions-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .action-btn {
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn.explore { background: linear-gradient(135deg, #2c5530, #1a3320); }
        .action-btn.gather { background: linear-gradient(135deg, #feca57, #ff9f43); }
        .action-btn.craft { background: linear-gradient(135deg, #54a0ff, #2e86de); }
        .action-btn.rest { background: linear-gradient(135deg, #5f27cd, #341f97); }
        .action-btn.eat { background: linear-gradient(135deg, #ff6b6b, #ee5a6f); }
        .action-btn.drink { background: linear-gradient(135deg, #54a0ff, #2e86de); }
        .action-btn.fight { background: linear-gradient(135deg, #ff4757, #ff3838); }

        .action-icon {
            font-size: 28px;
        }

        /* 鏃ュ織鍖哄煙 */
        .log-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .log-entry {
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            line-height: 1.6;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry.good { color: #5f27cd; }
        .log-entry.bad { color: #ff6b6b; }
        .log-entry.info { color: #fff; }
        .log-entry.fight { color: #ff4757; }

        /* 寮€濮嬬晫闈?*/
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c5530 0%, #1a3320 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 30px;
        }

        .start-screen.hidden {
            display: none;
        }

        .start-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #feca57, #ff9f43);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .start-desc {
            font-size: 16px;
            text-align: center;
            opacity: 0.8;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .start-btn {
            padding: 20px 60px;
            background: linear-gradient(135deg, #feca57, #ff9f43);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(254, 202, 87, 0.4);
        }

        /* 鎴樻枟鐣岄潰 */
        .fight-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c0a0a 0%, #1a0505 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 30px;
        }

        .fight-screen.hidden {
            display: none;
        }

        .fight-enemy {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .fight-enemy-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ff4757;
        }

        .fight-status {
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
        }

        .fight-bar {
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .fight-fill {
            height: 100%;
            transition: width 0.5s ease;
        }

        .fight-fill.player { background: linear-gradient(90deg, #54a0ff, #2e86de); }
        .fight-fill.enemy { background: linear-gradient(90deg, #ff4757, #ff3838); }

        .fight-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .fight-btn {
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
        }

        .fight-btn.attack { background: linear-gradient(135deg, #ff4757, #ff3838); }
        .fight-btn.defend { background: linear-gradient(135deg, #54a0ff, #2e86de); }
        .fight-btn.special { background: linear-gradient(135deg, #feca57, #ff9f43); }
        .fight-btn.run { background: linear-gradient(135deg, #95a5a6, #7f8c8d); }

        .combat-log {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            max-height: 150px;
            overflow-y: auto;
        }

        .combat-entry {
            font-size: 14px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 鎻愮ず妗?*/
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }

        /* 鎶樺彔闈㈡澘 */
        .resources-panel > div:not(.resources-title) {
            transition: max-height 0.3s ease, opacity 0.3s ease;
            max-height: 1000px;
            opacity: 1;
        }

        .resources-panel.collapsed > div:not(.resources-title) {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }

        .resources-title:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- 寮€濮嬬晫闈?-->
    <div class="start-screen" id="startScreen">
        <div class="start-title">馃尨 鑽掗噹姹傜敓</div>
        <div class="start-desc">
            浣犺鍥板湪涓€涓绉樼殑鑽掑矝涓?br>
            杩欓噷涓嶄粎鏈変赴瀵岀殑璧勬簮锛岃繕鏈夊嚩鐚涚殑鎬吔锛?br>
            <br>
            鏀堕泦璧勬簮銆佸埗浣滃伐鍏枫€佸嚮璐ユ€吔<br>
            鍔姏鐢熷瓨涓嬪幓锛?        </div>
        <button class="start-btn" onclick="startGame()">寮€濮嬬敓瀛?/button>
    </div>

    <!-- 鎴樻枟鐣岄潰 -->
    <div class="fight-screen hidden" id="fightScreen">
        <div class="fight-enemy" id="fightEnemyEmoji">馃惡</div>
        <div class="fight-enemy-name" id="fightEnemyName">閲庣嫾</div>
        
        <div class="fight-status">
            <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                <span>馃挭 浣?/span>
                <span id="playerFightHp">100/100</span>
            </div>
            <div class="fight-bar">
                <div class="fight-fill player" id="playerFightBar" style="width: 100%;"></div>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                <span id="enemyFightName">閲庣嫾</span>
                <span id="enemyFightHp">50/50</span>
            </div>
            <div class="fight-bar">
                <div class="fight-fill enemy" id="enemyFightBar" style="width: 100%;"></div>
            </div>
        </div>

        <div class="fight-actions">
            <button class="fight-btn attack" onclick="fightAttack()">鈿旓笍 鏀诲嚮</button>
            <button class="fight-btn defend" onclick="fightDefend()">馃洝锔?闃插尽</button>
            <button class="fight-btn special" onclick="fightSpecial()">鉁?鐗规畩</button>
            <button class="fight-btn run" onclick="fightRun()">馃弮 閫冭窇</button>
        </div>

        <div class="combat-log" id="combatLog"></div>
    </div>

    <!-- 娓告垙涓荤晫闈?-->
    <div class="game-container hidden" id="gameContainer">
        <!-- 澶╂皵鏄剧ず -->
        <div class="weather-display" id="weatherDisplay">
            <div class="weather-icon" id="weatherIcon">鈽€锔?/div>
            <div class="weather-info">
                <div class="weather-name" id="weatherName">鏅村ぉ</div>
                <div class="weather-effect" id="weatherEffect">鏃犵壒娈婂奖鍝?/div>
            </div>
        </div>
    
        <div class="game-header">
            <div class="game-title">馃尨 鑽掗噹姹傜敓</div>
            <div class="day-counter">绗?<span id="dayCount">1</span> 澶?| <span id="timeDisplay">鐧藉ぉ</span></div>
        </div>

        <!-- 鐘舵€侀潰鏉?-->
        <div class="status-panel">
            <!-- 宸︿晶灏忎汉 -->
            <div class="character-display">
                <div class="character-emoji" id="characterEmoji">馃</div>
                <div class="character-name">骞稿瓨鑰?/div>
            </div>
            
            <!-- 鍙充晶灞炴€ф潯 -->
            <div class="status-bars">
                <div class="status-item">
                    <div class="status-label">鉂わ笍 鍋ュ悍</div>
                    <div class="status-bar">
                        <div class="status-fill health" id="healthBar" style="width: 100%;"></div>
                    </div>
                    <div class="status-value"><span id="healthValue">100</span>/100</div>
                </div>

                <div class="status-item">
                    <div class="status-label">馃崠 楗ラタ</div>
                    <div class="status-bar">
                        <div class="status-fill hunger" id="hungerBar" style="width: 100%;"></div>
                    </div>
                    <div class="status-value"><span id="hungerValue">100</span>/100</div>
                </div>

                <div class="status-item">
                    <div class="status-label">馃挧 鍙ｆ复</div>
                    <div class="status-bar">
                        <div class="status-fill thirst" id="thirstBar" style="width: 100%;"></div>
                    </div>
                    <div class="status-value"><span id="thirstValue">100</span>/100</div>
                </div>

                <div class="status-item">
                    <div class="status-label">鈿?浣撳姏</div>
                    <div class="status-bar">
                        <div class="status-fill energy" id="energyBar" style="width: 100%;"></div>
                    </div>
                    <div class="status-value"><span id="energyValue">100</span>/100</div>
                </div>

                <div class="status-item" style="grid-column: span 2;">
                    <div class="status-label">鈿旓笍 鏀诲嚮鍔?/div>
                    <div class="status-bar">
                        <div class="status-fill attack" id="attackBar" style="width: 20%;"></div>
                    </div>
                    <div class="status-value"><span id="attackValue">10</span> <span style="font-size: 11px; opacity: 0.7;">(鍩虹 10)</span></div>
                </div>

                <div class="status-item" style="grid-column: span 2;">
                    <div class="status-label">馃尅锔?浣撴俯</div>
                    <div class="status-bar">
                        <div class="status-fill temperature" id="tempBar" style="width: 50%;"></div>
                    </div>
                    <div class="status-value"><span id="tempValue">37</span>掳C <span id="tempStatus" style="font-size: 11px; opacity: 0.7;">(姝ｅ父)</span></div>
                </div>
            </div>
        </div>

        <!-- 鍦烘櫙鍖哄煙 -->
        <div class="scene-area">
            <div class="scene-title">
                <span id="sceneEmoji">馃彇锔?/span>
                <span id="sceneName">娴锋哗</span>
            </div>
            <div class="scene-description" id="sceneDesc">
                浣犻啋鏉ユ椂鍙戠幇鑷繁韬哄湪涓€鐗囬檶鐢熺殑娴锋哗涓婏紝娴锋氮杞绘媿鐫€宀歌竟锛岃繙澶勬槸鑼傚瘑鐨勪笡鏋?..
            </div>
            <div class="scene-emoji" id="sceneImage">馃彇锔?/div>
            
            <!-- 鍦板浘閫夋嫨 -->
            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px; opacity: 0.8;">馃椇锔?閫夋嫨鍓嶅線鐨勫湴鐐癸細</div>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
                    <button onclick="travelTo('beach')" style="padding: 10px; background: rgba(254, 202, 87, 0.2); border: 1px solid #feca57; border-radius: 8px; color: #fff; cursor: pointer; font-size: 13px;">
                        馃彇锔?娴锋哗
                    </button>
                    <button onclick="travelTo('forest')" style="padding: 10px; background: rgba(46, 204, 113, 0.2); border: 1px solid #2ecc71; border-radius: 8px; color: #fff; cursor: pointer; font-size: 13px;">
                        馃尣 涓涙灄
                    </button>
                    <button onclick="travelTo('mountain')" style="padding: 10px; background: rgba(149, 165, 166, 0.2); border: 1px solid #95a5a6; border-radius: 8px; color: #fff; cursor: pointer; font-size: 13px;">
                        鉀帮笍 灞辨礊
                    </button>
                    <button onclick="travelTo('river')" style="padding: 10px; background: rgba(52, 152, 219, 0.2); border: 1px solid #3498db; border-radius: 8px; color: #fff; cursor: pointer; font-size: 13px;">
                        馃彏锔?娌宠竟
                    </button>
                    <button onclick="travelTo('mine')" style="padding: 10px; background: rgba(241, 196, 15, 0.2); border: 1px solid #f1c40f; border-radius: 8px; color: #fff; cursor: pointer; font-size: 13px; grid-column: span 2;">
                        鉀忥笍 鐭垮満
                    </button>
                </div>
            </div>
        </div>

        <!-- 璧勬簮闈㈡澘 -->
        <div class="resources-panel">
            <div class="resources-title" style="cursor: pointer;" onclick="togglePanel('backpackPanel')">
                馃帓 鑳屽寘 <span id="backpackIcon" style="float: right;">鈻?/span>
            </div>
            <div id="backpackPanel">
            
            <!-- 椋熺墿鍜屾按 -->
            <div style="margin-bottom: 20px;">
                <div class="resources-title" style="font-size: 16px; margin-bottom: 10px;">馃崠 椋熺墿涓庢按</div>
                <div class="resources-grid">
                    <div class="resource-item">
                        <div class="resource-icon">馃崠</div>
                        <div class="resource-name">椋熺墿</div>
                        <div class="resource-count" id="foodCount">0</div>
                    </div>
                    <div class="resource-item">
                        <div class="resource-icon">馃挧</div>
                        <div class="resource-name">姘?/div>
                        <div class="resource-count" id="waterCount">0</div>
                    </div>
                    <div class="resource-item">
                        <div class="resource-icon">馃尶</div>
                        <div class="resource-name">鑽夎嵂</div>
                        <div class="resource-count" id="herbCount">0</div>
                    </div>
                </div>
            </div>
            
            <!-- 鏉愭枡 -->
            <div style="margin-bottom: 20px;">
                <div class="resources-title" style="font-size: 16px; margin-bottom: 10px;">馃 鏉愭枡</div>
                <div class="resources-grid">
                    <div class="resource-item">
                        <div class="resource-icon">馃</div>
                        <div class="resource-name">鏈ㄦ潗</div>
                        <div class="resource-count" id="woodCount">0</div>
                    </div>

        // 鍒锋柊澶╂皵

        // 妫€鏌ユ俯搴︾姸鎬?        function checkTemperature() {
            const weather = WEATHER[gameState.weather];
            
            // 澶╂皵褰卞搷浣撴俯
            gameState.temperature += weather.tempMod * 0.1;
            
            // 鏃堕棿褰卞搷浣撴俯锛堝鏅氭洿鍐凤級
            if (gameState.time === '澶滄櫄') {
                gameState.temperature -= 0.2;
            }
            
            // 浣撴俯寮傚父褰卞搷鐢熷懡
            if (gameState.temperature > 39) {
                gameState.health -= 2;
                addLog('鍙戠儳浜嗭紝鐢熷懡鍊?-2', 'bad');
            } else if (gameState.temperature < 35) {
                gameState.health -= 2;
                addLog('浣撴俯杩囦綆锛岀敓鍛藉€?-2', 'bad');
            }
            
            // 鑷姩璋冭妭浣撴俯
            if (gameState.temperature > 37 && gameState.temperature < 37.5) {
                gameState.temperature -= 0.1;
            } else if (gameState.temperature < 37 && gameState.temperature > 36.5) {
                gameState.temperature += 0.1;
            }
            
            // 闄愬埗浣撴俯鑼冨洿
            gameState.temperature = Math.max(30, Math.min(42, gameState.temperature));
        }

        // 鍓嶅線鎸囧畾鍦烘櫙
        function travelTo(sceneKey) {
            if (gameState.energy < 15) {
                showToast('浣撳姏涓嶈冻锛?);
                return;
            }
            
            if (gameState.scene === sceneKey) {
                showToast('宸茬粡鍦ㄨ鍦扮偣浜嗭紒');
                return;
            }
            
            gameState.energy -= 15;
            gameState.hunger -= 10;
            gameState.thirst -= 10;
            
            const oldScene = SCENES[gameState.scene];
            const newScene = SCENES[sceneKey];
            
            gameState.scene = sceneKey;
            addLog(`浠?${oldScene.name} 鍓嶅線 ${newScene.name}`, 'info');
            addLog(`鍒拌揪浜?${newScene.name}锛?{newScene.description}`, 'good');
            
            // 鏍规嵁澶╂皵璁＄畻閬囧埌鎬吔鐨勬鐜?            const weather = WEATHER[gameState.weather];
            const encounterChance = 0.3 * weather.monsterMod;
            
            if (Math.random() < encounterChance && newScene.monsters.length > 0) {
                const monsterName = newScene.monsters[Math.floor(Math.random() * newScene.monsters.length)];
                const monster = MONSTERS.find(m => m.name === monsterName);
                if (monster) {
                    setTimeout(() => startFight(monster), 1000);
                }
            }
            
            advanceTime();
            updateUI();
        }

        // 鎺㈢储
        function explore() {
            if (gameState.energy < 20) {
                showToast('浣撳姏涓嶈冻锛?);
                return;
            }

            gameState.energy -= 20;
            gameState.hunger -= 10;
            gameState.thirst -= 15;

            const scenes = Object.keys(SCENES);
            const newScene = scenes[Math.floor(Math.random() * scenes.length)];
            gameState.scene = newScene;
            const scene = SCENES[newScene];

            addLog(`浣犳帰绱㈠埌浜?${scene.name}锛乣, 'good');

            // 鏍规嵁澶╂皵璁＄畻閬囧埌鎬吔鐨勬鐜?            const weather = WEATHER[gameState.weather];
            const encounterChance = 0.5 * weather.monsterMod;
            
            if (Math.random() < encounterChance && scene.monsters.length > 0) {
                const monsterName = scene.monsters[Math.floor(Math.random() * scene.monsters.length)];
                const monster = MONSTERS.find(m => m.name === monsterName);

            // 30% 姒傜巼鍙戠幇璧勬簮

        // 閲囬泦鎸囧畾绫诲瀷璧勬簮
        function gather(type) {
            if (gameState.energy < 15) {
                showToast('浣撳姏涓嶈冻锛?);
                return;
            }

            const scene = SCENES[gameState.scene];
            
            // 妫€鏌ュ綋鍓嶅満鏅槸鍚︽湁璇ヨ祫婧?            if (!scene.resources.includes(type)) {
                showToast(`杩欓噷鎵句笉鍒?{getResourceName(type)}锛乣);
                return;
            }

            // 鏍规嵁绫诲瀷鍐冲畾閲囬泦閲忓拰娑堣€?            const amounts = {
                food: { amount: [1, 3], energy: 15, hunger: 8, thirst: 10 },
                water: { amount: [2, 4], energy: 15, hunger: 8, thirst: 10 },
                wood: { amount: [2, 4], energy: 20, hunger: 10, thirst: 12 },
                stone: { amount: [1, 3], energy: 20, hunger: 10, thirst: 12 },
                herb: { amount: [1, 2], energy: 15, hunger: 8, thirst: 10 },
                fiber: { amount: [2, 4], energy: 12, hunger: 6, thirst: 8 },
                goldOre: { amount: [1, 2], energy: 25, hunger: 12, thirst: 15 },
                silverOre: { amount: [1, 3], energy: 22, hunger: 10, thirst: 12 },
                copperOre: { amount: [2, 4], energy: 18, hunger: 8, thirst: 10 },
                ironOre: { amount: [2, 5], energy: 15, hunger: 6, thirst: 8 }
            };

            // 鐭跨煶鍑虹幇姒傜巼
            const oreChance = {
                goldOre: 0.03,    // 金矿 3%
                silverOre: 0.07,  // 银矿 7%
                copperOre: 0.15,  // 铜矿 15%
                ironOre: 0.25,    // 铁矿 25%
                stone: 0.60       // 石头 60%
            };

            const config = amounts[type];
            
            // 濡傛灉鏄熆鐭崇被鍨嬶紝鍏堟鏌ユ鐜?            if (oreChance[type] !== undefined) {
                var roll = Math.random();
                if (roll > oreChance[type]) {
                    gameState.energy -= Math.floor(config.energy / 2);
                    gameState.hunger -= Math.floor(config.hunger / 2);
                    gameState.thirst -= Math.floor(config.thirst / 2);
                    addLog('鎸栦簡鍗婂ぉ锛屼粈涔堢熆涔熸病鎵惧埌...锛? + getResourceName(type) + '鍑虹幇姒傜巼' + Math.floor(oreChance[type] * 100) + '%锛?, 'bad');
                    document.getElementById('gatherOptions').style.display = 'none';
                    advanceTime();
                    updateUI();
                    return;
                }
            }

            const amount = Math.floor(Math.random() * (config.amount[1] - config.amount[0] + 1)) + config.amount[0];

            gameState.resources[type] += amount;
            gameState.energy -= config.energy;
            gameState.hunger -= config.hunger;
            gameState.thirst -= config.thirst;

            addLog('閲囬泦浜?' + amount + ' 涓? + getResourceName(type) + '锛?, 'good');
            
            // 鍏抽棴閲囬泦闈㈡澘
            document.getElementById('gatherOptions').style.display = 'none';
            
            advanceTime();
            updateUI();
        }

            var item = SHOP_ITEMS[itemKey];
            if (gameState.resources.gold < item.price) {
                showToast('閲戝竵涓嶈冻锛侀渶瑕?' + item.price + ' 閲戝竵');
                return;
            }
            gameState.resources.gold -= item.price;

            if (item.effect === 'attack') {
                gameState.attack += item.value;
                addLog('璐拱浜? + item.name + '锛佹敾鍑诲姏 +' + item.value, 'good');
            } else if (item.effect === 'health') {
                gameState.health = Math.min(100, gameState.health + item.value);
                addLog('璐拱浜? + item.name + '锛佺敓鍛藉€?+' + item.value, 'good');
            } else if (item.effect === 'armor') {
                gameState.resources.armor += item.value;
                addLog('璐拱浜? + item.name + '锛侀槻寰?+' + item.value, 'good');
            } else if (item.effect === 'energy') {
                gameState.energy = Math.min(100, gameState.energy + item.value);
                addLog('璐拱浜? + item.name + '锛佷綋鍔?+' + item.value, 'good');
            }
            updateUI();
        }

        // ==================== 鎴樻枟绯荤粺 ====================

        let fightState = {
            playerHp: 100,
            enemyHp: 50,
            enemy: null,
            defending: false
        };

        // 寮€濮嬫垬鏂?        function startFight(monster) {
            gameState.inFight = true;
            gameState.currentEnemy = monster;
            fightState = {
                playerHp: gameState.health,
                enemyHp: monster.hp,
                enemy: monster,
                defending: false
            };

            document.getElementById('fightEnemyEmoji').textContent = monster.emoji;
            document.getElementById('fightEnemyName').textContent = monster.name;
            document.getElementById('enemyFightName').textContent = monster.name;
            document.getElementById('fightScreen').classList.remove('hidden');
            document.getElementById('combatLog').innerHTML = '';

            addLog(`閬亣浜?${monster.emoji} ${monster.name}锛乣, 'fight');
            addCombatLog(`浣犻伃閬囦簡 ${monster.name}锛佸噯澶囨垬鏂楋紒`);
            updateFightUI();
        }

        // 鏇存柊鎴樻枟 UI
        function updateFightUI() {
            const playerPercent = (fightState.playerHp / 100) * 100;
            const enemyPercent = (fightState.enemyHp / fightState.enemy.hp) * 100;
            
            document.getElementById('playerFightBar').style.width = playerPercent + '%';
            document.getElementById('playerFightHp').textContent = `${Math.max(0, fightState.playerHp)}/100`;
            document.getElementById('enemyFightBar').style.width = enemyPercent + '%';
            document.getElementById('enemyFightHp').textContent = `${Math.max(0, fightState.enemyHp)}/${fightState.enemy.hp}`;
        }

        // 娣诲姞鎴樻枟鏃ュ織
        function addCombatLog(message) {
            const log = document.getElementById('combatLog');
            const entry = document.createElement('div');
            entry.className = 'combat-entry';
            entry.textContent = message;
            log.insertBefore(entry, log.firstChild);
        }

        // 鐜╁鏀诲嚮
        function fightAttack() {
            if (!gameState.inFight) return;

            const damage = gameState.attack + Math.floor(Math.random() * 5);
            fightState.enemyHp -= damage;
            addCombatLog(`浣犳敾鍑?${fightState.enemy.name}锛岄€犳垚 ${damage} 鐐逛激瀹筹紒`);

            if (fightState.enemyHp <= 0) {
                winFight();
                return;
            }

            enemyTurn();
            updateFightUI();
        }

        // 鐜╁闃插尽
        function fightDefend() {
            if (!gameState.inFight) return;

            fightState.defending = true;
            addCombatLog('浣犻噰鍙栭槻寰″Э鎬侊紝鍑忓皯鍙楀埌鐨勪激瀹筹紒');
            enemyTurn();
            fightState.defending = false;
            updateFightUI();
        }

        // 鐗规畩鏀诲嚮
        function fightSpecial() {
            if (!gameState.inFight) return;

            if (gameState.resources.weapon > 0) {
                gameState.resources.weapon--;
                const damage = gameState.attack * 2 + Math.floor(Math.random() * 10);
                fightState.enemyHp -= damage;
                addCombatLog(`浣跨敤姝﹀櫒鍙戝姩鐗规畩鏀诲嚮锛侀€犳垚 ${damage} 鐐逛激瀹筹紒`);
                updateUI();

                if (fightState.enemyHp <= 0) {
                    winFight();
                    return;
                }
            } else {
                addCombatLog('娌℃湁姝﹀櫒锛屾棤娉曞彂鍔ㄧ壒娈婃敾鍑伙紒');
                return;
            }

            enemyTurn();
            updateFightUI();
        }

        // 閫冭窇
        function fightRun() {
            if (!gameState.inFight) return;

            if (Math.random() < 0.5) {
                addCombatLog('浣犳垚鍔熼€冭窇浜嗭紒');
                endFight(false);
            } else {
                addCombatLog('閫冭窇澶辫触锛?);
                enemyTurn();
                updateFightUI();
            }
        }

        // 鏁屼汉鍥炲悎
        function enemyTurn() {
            const enemy = fightState.enemy;
            let damage = enemy.attack - Math.floor(Math.random() * 3);
            
            if (fightState.defending) {
                damage = Math.floor(damage / 2);
            }
            
            damage = Math.max(1, damage);
            fightState.playerHp -= damage;
            addCombatLog(`${enemy.name} 鏀诲嚮浣狅紝閫犳垚 ${damage} 鐐逛激瀹筹紒`);

            if (fightState.playerHp <= 0) {
                loseFight();
            }
        }

        // 鑳滃埄
        function winFight() {
            const enemy = fightState.enemy;
            addCombatLog(`馃帀 浣犲嚮璐ヤ簡 ${enemy.name}锛佽幏寰?${enemy.exp} 缁忛獙锛乣);
            addLog(`鍑昏触浜?${enemy.emoji} ${enemy.name}锛屾敾鍑诲姏 +2锛乣, 'good');
            
            // 濂栧姳
            gameState.attack += 2;
            gameState.health = Math.min(100, gameState.health + 10);
            
            // 姒傜巼鎺夎惤鐗╁搧
            if (Math.random() < 0.3) {
                const drop = Math.random() < 0.5 ? 'food' : 'herb';
                const amount = Math.floor(Math.random() * 2) + 1;
                gameState.resources[drop] += amount;
                addCombatLog(`鑾峰緱浜?${amount} 涓?{getResourceName(drop)}锛乣);
            }

            setTimeout(() => {
                endFight(true);
            }, 1500);
        }

        // 澶辫触
        function loseFight() {
            addCombatLog('馃拃 浣犺鎵撹触浜?..');
            addLog(`琚?${fightState.enemy.name} 鎵撹触浜嗭紝鐢熷懡鍊煎ぇ骞呴檷浣庯紒`, 'bad');
            
            gameState.health = 1;
            setTimeout(() => {
                endFight(false);
            }, 1500);
        }

        // 缁撴潫鎴樻枟
        function endFight(won) {
            gameState.inFight = false;
            gameState.currentEnemy = null;
            document.getElementById('fightScreen').classList.add('hidden');
            updateUI();
        }

        // 鍒囨崲闈㈡澘鎶樺彔鐘舵€?        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            const icon = document.getElementById(panelId.replace('Panel', 'Icon'));
            const parent = panel.parentElement;
            
            if (parent.classList.contains('collapsed')) {
                parent.classList.remove('collapsed');
                icon.textContent = '鈻?;
            } else {
                parent.classList.add('collapsed');
                icon.textContent = '鈻?;
            }
        }
    </script>
</body>
</html>
